<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>{{ .Title }} · {{ site.Title }}</title>
<style>
  img { max-width: 100%; height: auto; }
  /* Image alignment set in hugo-writer is kept in the URL fragment: ![](x.webp#right) */
  img[src$="#left"] { display: block; margin: 0 auto 0 0; }
  img[src$="#center"] { display: block; margin: 0 auto; }
  img[src$="#right"] { display: block; margin: 0 0 0 auto; }
</style></head>
<body><main>{{ block "main" . }}{{ end }}</main></body>
</html>
